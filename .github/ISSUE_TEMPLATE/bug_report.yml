name: Bug report
description: Report a reproducible DisRoute problem without sharing credentials.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a complete VLESS link, UUID, key, server address, runtime configuration, packet capture, or unredacted log.
  - type: input
    id: version
    attributes:
      label: DisRoute version
      placeholder: Copy the version displayed in DisRoute
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation path
      options:
        - Setup installer (first installation)
        - In-app update
        - Setup installer over an older version
        - Portable ZIP
    validations:
      required: true
  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection mode
      options:
        - Personal configuration
        - Community Quick Connect
        - Not a connection issue
    validations:
      required: true
  - type: input
    id: previous_version
    attributes:
      label: Previous version (if updating)
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Connection startup
        - Discord launch
        - Text or media
        - Voice
        - Streaming
        - Tray or lifecycle
        - Interface
        - Packaging or setup
        - In-app update or saved configuration
        - Non-Discord traffic routing
        - Community sources or testing
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use placeholders for every credential and server value.
      placeholder: |
        1. Start DisRoute as Administrator
        2. Choose personal configuration or Community Quick Connect (do not paste the configuration)
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and visible error
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, server addresses, IP addresses, personal paths, and account identifiers.
          required: true
        - label: I checked the latest release and the troubleshooting guide (if the problem prevents updating, explain that above).
          required: true
