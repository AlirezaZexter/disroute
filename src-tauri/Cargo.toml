[package]
name = "disroute"
version = "0.4.1"
description = "Discord-only network routing for Windows"
authors = ["DisRoute contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/AlirezaZexter/disroute"
edition = "2021"

[lib]
name = "disroute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[features]
# Tauri CLI enables this feature for production builds so the bundled web
# assets use the app protocol instead of the development localhost URL.
custom-protocol = ["tauri/custom-protocol"]
